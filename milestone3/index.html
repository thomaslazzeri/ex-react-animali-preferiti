<!-- index.html -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I miei animali Preferiti</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body>
    <header>
        <h1>I miei animali Preferiti</h1>
    </header>
    <main>
        <figure>
            <img src="https://picsum.photos/400/300" alt="Immagine Casuale">
        </figure>
        <div class="lista-animali"></div>
    </main>
    <footer>
        <p>Creato con amore da... un collega sbadato! 🐾</p>
    </footer>

    <script type="text/babel">
        const { useState } = React;

        function Modal({
            title,
            content,
            show = false,
            onClose = () => { },
            onConfirm = () => { }
        }) {
            return show && ReactDOM.createPortal(
                <div className="modal-container">
                    <div className="modal">
                        <h2>{title}</h2>
                        <div>{content}</div>
                        <div className="modal-actions">
                            <button onClick={onClose}>Annulla</button>
                            <button onClick={onConfirm}>Conferma</button>
                        </div>
                    </div>
                </div>,
                document.body
            )
        }

        const ListaAnimali = () => {
            const [animals, setAnimals] = useState([]);
            const [showModal, setShowModal] = useState(false);
            const [newAnimal, setNewAnimal] = useState("");

            const closeModal = () => {
                setShowModal(false);
                setNewAnimal("");
            };

            const confirmAnimal = () => {
                const name = newAnimal.trim();
                if (name === "") return;
                setAnimals([...animals, name]);
                closeModal();
            };

            return (
                <>
                    <button onClick={() => setShowModal(true)}>Aggiungi Animale</button>
                    <Modal
                        title="Aggiungi un animale"
                        content={
                            <input
                                type="text"
                                placeholder="Nome dell'animale"
                                value={newAnimal}
                                onChange={e => setNewAnimal(e.target.value)}
                            />
                        }
                        show={showModal}
                        onClose={closeModal}
                        onConfirm={confirmAnimal}
                    />

                    <details>
                        <summary>Animali</summary>
                        <ul>
                            {animals.map((a, idx) => (
                                <li key={idx}>{a}</li>
                            ))}
                        </ul>
                    </details>
                </>
            );
        };

        const root = ReactDOM.createRoot(document.querySelector('.lista-animali'));
        root.render(<ListaAnimali />);
    </script>
</body>

</html>
